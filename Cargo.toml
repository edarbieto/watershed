[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
watershed-audio = { path = "crates/audio" }
watershed-dsp = { path = "crates/dsp" }
watershed-separation = { path = "crates/separation" }
watershed-storage = { path = "crates/storage" }

anyhow = "1"
cpal = "0.18"
directories = "6"
eframe = "0.36"
env_logger = "0.11"
log = "0.4"
rfd = "0.17"
rtrb = "0.4"
rubato = "5"
serde = { version = "1", features = ["derive"] }
symphonia = { version = "0.6", features = ["mp3", "aac", "isomp4", "alac"] }
thiserror = "2"
toml = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Keep DSP and model code usable in debug builds.
[profile.dev.package."*"]
opt-level = 2

# Our own hot paths too: unoptimized decoding and mixing overload the CPU and can
# make the audio callback miss its deadline. Debug assertions stay on.
[profile.dev.package.watershed-dsp]
opt-level = 3

[profile.dev.package.watershed-audio]
opt-level = 3
