name: CI

# Format, clippy and tests on the three systems. Release builds come from
# release.yml (on a tag, or by hand from the Actions tab). Changes to docs only
# do not run it.
on:
  push:
    branches: [master]
    paths-ignore: ["docs/**", "**.md", "assets/**", "LICENSE-*", "site/**", ".github/workflows/pages.yml"]
  pull_request:
    paths-ignore: ["docs/**", "**.md", "assets/**", "LICENSE-*", "site/**", ".github/workflows/pages.yml"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev libasound2-dev

      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
