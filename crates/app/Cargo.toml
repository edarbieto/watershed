[package]
name = "watershed"
description = "Separate songs into stems and practice over them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
watershed-audio.workspace = true
watershed-dsp.workspace = true
watershed-separation.workspace = true
watershed-storage.workspace = true

# `persistence` remembers the window (see `window.rs`).
eframe = { workspace = true, features = ["persistence"] }
env_logger.workspace = true
log.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
ureq.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# OpenGL on macOS: see `main.rs`.
eframe = { workspace = true, features = ["glow"] }
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

# The icon and version info inside the .exe: see `build.rs`.
[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

[dev-dependencies]
# eframe's window settings, to check that `window.rs` saves them in their shape.
egui-winit = { version = "0.36", default-features = false, features = ["serde"] }
ron = "0.12"

[lints]
workspace = true
