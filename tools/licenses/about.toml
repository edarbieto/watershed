# cargo-about settings for THIRD-PARTY-LICENSES.txt: see generate.sh.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "0BSD",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "LicenseRef-UFL-1.0",
    "MIT-0",
    "NCSA",
    "CDLA-Permissive-2.0",
    "bzip2-1.0.6",
]
# The release targets, so the file is the same whichever machine generates it.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]
ignore-dev-dependencies = true
ignore-build-dependencies = false
# Watershed's own crates (publish = false) are not third-party.
private = { ignore = true }
